version: 2.1

# Define the repository subfolder name for all jobs
# This is required because 'git checkout' places the code inside a directory named after the repo.
# Change this variable if your repo folder name is different.
parameters:
  repo_folder:
    type: string
    default: "SecureBankingPaymentPortal-main"

jobs:
  backend_ci:
    docker:
      - image: cimg/node:18.19
    # Run the job from the default checkout directory
    working_directory: ~/project 
    steps:
      - checkout
      - restore_cache:
          keys:
            # FIX: Cache key must include the repo_folder path
            - backend-deps-{{ checksum << parameters.repo_folder >> "/Backend/package-lock.json" }}
            - backend-deps-
      - run:
          name: Install backend dependencies
          command: |
            # FIX: Must 'cd' into the full path
            cd << parameters.repo_folder >>/Backend
            npm install 
      - save_cache:
          key: backend-deps-{{ checksum << parameters.repo_folder >> "/Backend/package-lock.json" }}
          paths:
            - << parameters.repo_folder >>/Backend/node_modules
      - run:
          name: Type check backend
          command: |
            cd << parameters.repo_folder >>/Backend
            npx tsc --noEmit
      - run:
          name: Test backend (with coverage)
          command: |
            cd << parameters.repo_folder >>/Backend
            npm test -- --ci --passWithNoTests --watchAll=false --coverage
      - run:
          name: Build backend
          command: |
            cd << parameters.repo_folder >>/Backend
            npm run build
      - persist_to_workspace:
          root: << parameters.repo_folder >>/Backend
          paths:
            - coverage/lcov.info

  frontend_ci:
    docker:
      - image: cimg/node:18.19
    working_directory: ~/project
    steps:
      - checkout
      - restore_cache:
          keys:
            # FIX: Cache key must include the repo_folder path
            - frontend-deps-{{ checksum << parameters.repo_folder >> "/Frontend/package-lock.json" }}
            - frontend-deps-
      - run:
          name: Install frontend dependencies
          command: |
            # FIX: Must 'cd' into the full path
            cd << parameters.repo_folder >>/Frontend
            npm install 
      - save_cache:
          key: frontend-deps-{{ checksum << parameters.repo_folder >> "/Frontend/package-lock.json" }}
          paths:
            - << parameters.repo_folder >>/Frontend/node_modules
      - run:
          name: Test frontend (with coverage)
          environment:
            CI: "true"
          command: |
            cd << parameters.repo_folder >>/Frontend
            npm test -- --watchAll=false --coverage
      - run:
          name: Build frontend
          command: |
            cd << parameters.repo_folder >>/Frontend
            npm run build
      - persist_to_workspace:
          root: << parameters.repo_folder >>/Frontend
          paths:
            - coverage/lcov.info

  sonarqube_scan:
    docker:
      - image: cimg/node:18.19
    working_directory: ~/project
    steps:
      - checkout
      # FIX: Must attach the workspace to the subfolder directory
      - attach_workspace:
          at: << parameters.repo_folder >>/Backend
      - attach_workspace:
          at: << parameters.repo_folder >>/Frontend
      - run:
          name: Install SonarScanner CLI
          command: npm install -g sonar-scanner
      - run:
          name: Run SonarQube Analysis
          command: |
            # FIX: Paths for sources/tests and reports must include the repo_folder path
            cd << parameters.repo_folder >>
            npx sonar-scanner \
              -Dsonar.projectKey=ST10303347vc_secure-payment-portal \
              -Dsonar.host.url=https://sonarcloud.io \
              -Dsonar.login=$SONAR_TOKEN \
              -Dsonar.sources=Backend,Frontend \
              -Dsonar.exclusions=node_modules/**,logs/** \
              -Dsonar.tests=Backend,Frontend \
              -Dsonar.test.inclusions=**/*.test.ts,**/*.test.tsx,**/*.spec.ts,**/*.spec.tsx \
              -Dsonar.javascript.lcov.reportPaths=Backend/coverage/lcov.info,Frontend/coverage/lcov.info

  security_scan:
    docker:
      - image: cimg/node:20.10
    working_directory: ~/project
    steps:
      - checkout
      - run:
          name: Install Core Utilities for Security Tools
          command: |
            sudo apt-get update
            sudo apt-get install -y curl unzip
      - run:
          name: Install Gitleaks
          command: |
            cd << parameters.repo_folder >>
            curl -sSL https://github.com/gitleaks/gitleaks/releases/download/v8.29.0/gitleaks_8.29.0_linux_x64.tar.gz -o gitleaks.tar.gz
            tar -xzf gitleaks.tar.gz gitleaks
            chmod +x gitleaks
            
      - run:
          name: Run Gitleaks secret scan
          command: |
            cd << parameters.repo_folder >>
            ./gitleaks detect --no-git --redact
            
      - run:
          name: Install OSV-Scanner
          command: |
            # FIX: Direct download with -L flag to ensure correct binary download
            cd << parameters.repo_folder >>
            curl -sSL -L https://github.com/google/osv-scanner/releases/download/v1.6.2/osv-scanner_1.6.2_linux_amd64.tar.gz -o osv-scanner.tar.gz
            tar -xzf osv-scanner.tar.gz osv-scanner
            chmod +x osv-scanner
            
      - run:
          name: Run OSV-Scanner on lockfiles
          command: |
            cd << parameters.repo_folder >>
            ./osv-scanner --lockfile Backend/package-lock.json --lockfile Frontend/package-lock.json

workflows:
  build_test_and_scan:
    jobs:
      - backend_ci
      - frontend_ci
      - sonarqube_scan:
          requires:
            - backend_ci
            - frontend_ci
      - security_scan