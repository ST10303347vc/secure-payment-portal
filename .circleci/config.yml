version: 2.1

jobs:
  backend_ci:
    docker:
      - image: cimg/node:18.19
    working_directory: ~/project 
    steps:
      - checkout:
          path: repo
      - restore_cache:
          keys:
            # FIX: Corrected to lowercase 'backend'
            - backend-deps-{{ checksum "repo/backend/package-lock.json" }}
            - backend-deps-
      - run:
          name: Install backend dependencies
          command: |
            # FIX: Corrected to lowercase 'backend'
            cd repo/backend
            npm install
      - save_cache:
          key: backend-deps-{{ checksum "repo/backend/package-lock.json" }}
          paths:
            - repo/backend/node_modules
      - run:
          name: Type check backend
          command: |
            cd repo/backend
            npx tsc --noEmit
      - run:
          name: Test backend (with coverage)
          command: |
            cd repo/backend
            npm test -- --ci --passWithNoTests --watchAll=false --coverage
      - run:
          name: Build backend
          command: |
            cd repo/backend
            npm run build
      - persist_to_workspace:
          root: repo
          paths:
            # FIX: Corrected to lowercase 'backend'
            - backend/coverage/lcov.info

  frontend_ci:
    docker:
      - image: cimg/node:18.19
    working_directory: ~/project
    steps:
      - checkout:
          path: repo
      - restore_cache:
          keys:
            - frontend-deps-{{ checksum "repo/Frontend/package-lock.json" }}
            - frontend-deps-
      - run:
          name: Install frontend dependencies
          command: |
            cd repo/Frontend
            npm install
      - save_cache:
          key: frontend-deps-{{ checksum "repo/Frontend/package-lock.json" }}
          paths:
            - repo/Frontend/node_modules
      - run:
          name: Test frontend (with coverage)
          environment:
            CI: "true"
          command: |
            cd repo/Frontend
            npm test -- --watchAll=false --coverage
      - run:
          name: Build frontend
          command: |
            cd repo/Frontend
            npm run build
      - persist_to_workspace:
          root: repo
          paths:
            - Frontend/coverage/lcov.info

  sonarqube_scan:
    docker:
      - image: cimg/node:18.19
    working_directory: ~/project
    steps:
      - checkout:
          path: repo
      - attach_workspace:
          at: repo
      
      - run:
          name: Install SonarScanner CLI
          command: npm install -g sonar-scanner
      - run:
          name: Run SonarQube Analysis
          command: |
            cd repo
            npx sonar-scanner \
              -Dsonar.projectKey=ST10303347vc_secure-payment-portal \
              -Dsonar.host.url=https://sonarcloud.io \
              -Dsonar.login=$SONAR_TOKEN \
              # FIX: Corrected to lowercase 'backend'
              -Dsonar.sources=backend,Frontend \
              -Dsonar.exclusions=node_modules/**,logs/** \
              -Dsonar.tests=backend,Frontend \
              -Dsonar.test.inclusions=**/*.test.ts,**/*.test.tsx,**/*.spec.ts,**/*.spec.tsx \
              -Dsonar.javascript.lcov.reportPaths=backend/coverage/lcov.info,Frontend/coverage/lcov.info

  security_scan:
    docker:
      - image: cimg/node:20.10
    working_directory: ~/project
    steps:
      - checkout:
          path: repo
      - run:
          name: Install Core Utilities for Security Tools
          command: |
            sudo apt-get update
            sudo apt-get install -y curl unzip
      - run:
          name: Install Gitleaks
          command: |
            cd repo
            curl -sSL https://github.com/gitleaks/gitleaks/releases/download/v8.29.0/gitleaks_8.29.0_linux_x64.tar.gz -o gitleaks.tar.gz
            tar -xzf gitleaks.tar.gz gitleaks
            chmod +x gitleaks
            
      - run:
          name: Run Gitleaks secret scan
          command: |
            cd repo
            ./gitleaks detect --no-git --redact
            
      - run:
          name: Install OSV-Scanner
          command: |
            cd repo
            curl -sSL -L https://github.com/google/osv-scanner/releases/download/v1.6.2/osv-scanner_1.6.2_linux_amd64 -o osv-scanner
            chmod +x osv-scanner
            
      - run:
          name: Run OSV-Scanner on lockfiles
          command: |
            cd repo
            # FIX: Corrected to lowercase 'backend'
            ./osv-scanner --lockfile backend/package-lock.json --lockfile Frontend/package-lock.json

workflows:
  build_test_and_scan:
    jobs:
      - backend_ci
      - frontend_ci
      - sonarqube_scan:
          requires:
            - backend_ci
            - frontend_ci
      - security_scan